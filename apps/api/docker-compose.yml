services:
  postgres:
    image: postgres:17-alpine
    container_name: atlas-api-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - '5433:5432'
    volumes:
      - atlas-api-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atlas-api-pg:
