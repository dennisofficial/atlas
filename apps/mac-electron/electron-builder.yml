appId: io.byatlas.mac
productName: Atlas
directories:
  output: release
files:
  - '*.js'
  - '*.cjs'
  - payload/**/*
  - package.json
extraResources:
  - from: dist/host.js
    to: app/host.js
  - from: dist
    to: app
    filter:
      - '**/*'
      - '!host.js'
      - '!web-standalone/**'
      - '!bin/**'
  - from: dist/web-standalone
    to: web-standalone
  - from: dist/bin/bun
    to: bin/bun
asar: true
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The app spawns Contents/Resources/bin/bun as its desktop host. @electron/osx-sign signs every path
  # in this list, with the hardened runtime and `entitlementsInherit`, before it signs the bundle; a
  # nested executable left unsigned makes the installed app refuse to launch.
  binaries:
    - Contents/Resources/bin/bun
  # @electron/osx-sign picks what to sign by content, not by Mach-O magic, so every PNG in this tree
  # reached codesign and aborted the build (2026-11-10). These files are data the bundled bun serves;
  # nothing in web-standalone is loaded as code (drop-native-web-deps removes sharp and @img).
  signIgnore:
    - '/web-standalone/'
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: Atlas ${version}
  artifactName: Atlas-${version}-mac-arm64.dmg
