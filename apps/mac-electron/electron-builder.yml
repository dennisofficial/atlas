appId: com.dltech.atlas.electron-spike
productName: Atlas Electron Spike
directories:
  output: release
files:
  - main.js
  - host-paths.js
  - host-process.js
  - web-payload.js
  - payload/**/*
  - package.json
extraResources:
  - from: dist/host.js
    to: app/host.js
  - from: dist
    to: app
    filter:
      - '**/*'
      - '!host.js'
      - '!web-standalone/**'
      - '!bin/**'
  - from: dist/web-standalone
    to: web-standalone
  - from: dist/bin/bun
    to: bin/bun
asar: true
mac:
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  title: ${productName} ${version}
