appId: io.byatlas.mac
productName: Atlas
directories:
  output: release
files:
  - '*.js'
  - '*.cjs'
  - payload/**/*
  - package.json
extraResources:
  - from: dist/host.js
    to: app/host.js
  - from: dist
    to: app
    filter:
      - '**/*'
      - '!host.js'
      - '!web-standalone/**'
      - '!bin/**'
  - from: dist/web-standalone
    to: web-standalone
  - from: dist/bin/bun
    to: bin/bun
asar: true
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The app spawns Contents/Resources/bin/bun as its desktop host. @electron/osx-sign signs every path
  # in this list, with the hardened runtime and `entitlementsInherit`, before it signs the bundle; a
  # nested executable left unsigned makes the installed app refuse to launch.
  binaries:
    - Contents/Resources/bin/bun
  notarize: true
  # Squirrel.Mac validates the replacement bundle from a zip, so auto-update cannot work from the
  # dmg alone; the zip and latest-mac.yml travel to the same release as the dmg.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  title: Atlas ${version}
  artifactName: macos-arm64-Atlas.dmg
# The feed the app reads for a new build: electron-updater fetches latest-mac.yml from the release
# marked latest, which `mac-release` re-marks only after the dmg and the zip are attached.
publish:
  provider: generic
  url: https://github.com/dennisofficial/atlas/releases/latest/download
