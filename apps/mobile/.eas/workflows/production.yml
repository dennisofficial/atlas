name: Production

defaults:
  tools:
    bun: '1.4.2'

on:
  push:
    branches: ['main']
    paths:
      - 'apps/mobile/**'
      - 'packages/api-router/**'
      - 'packages/client/**'
      - 'packages/commands/**'
      - 'packages/core/**'
      - 'packages/notifications/**'
      - 'packages/plugin-sdk/**'
      - 'packages/protocol/**'
      - 'packages/ui/**'
      - 'packages/ui-native/**'
      - 'packages/wire/**'
      - 'plugins/crew/**'
      - 'plugins/github/**'
      - 'plugins/mcp/**'
      - 'plugins/operator/**'
      - 'plugins/services/**'
      - 'plugins/sessions/**'
      - 'plugins/shells/**'
      - 'plugins/skills/**'
      - 'bun.lock'
      - 'patches/**'

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  ios_get_build:
    name: Find a build with this fingerprint
    needs: [fingerprint]
    type: get-build
    environment: production
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
      platform: ios
      channel: production
      distribution: store

  ios_build:
    name: Native build
    needs: [ios_get_build]
    if: ${{ !needs.ios_get_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  ios_testflight:
    name: TestFlight (external beta)
    needs: [ios_build]
    type: testflight
    environment: production
    params:
      build_id: ${{ needs.ios_build.outputs.build_id }}
      profile: production
      external_groups: ['Beta']

  ios_update:
    name: OTA update
    needs: [ios_get_build]
    if: ${{ needs.ios_get_build.outputs.build_id }}
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: EXPO_NO_BUNDLE_SPLITTING=1 npx eas-cli@latest update --channel production --platform ios --environment production --auto --non-interactive
      - uses: eas/posthog_upload_sourcemaps
        with:
          directory: dist/_expo/static/js/ios
