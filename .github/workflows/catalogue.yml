name: catalogue

# Keeps main's model catalogue fresh without pushing to main (the ruleset's required ci
# check makes direct pushes impossible). refresh regenerates the catalogue on drift and
# commits it through the REST git API (api-commit.sh) so GitHub web-signs the commit —
# Vercel refuses to build unsigned commits. The PR is queued for auto-merge at creation
# and GitHub lands it itself once ci is green; the automerge workflow is the janitor for
# held runs, conflicts, and stale PRs.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install

      - name: regenerate and open a PR on drift
        run: |
          set -euo pipefail
          (cd packages/harness && bun run generate:catalogue)
          if git diff --quiet -- packages/harness/src/models/generated; then
            echo "catalogue is fresh"
            exit 0
          fi
          branch="catalogue/$(date -u +%Y%m%d-%H%M)"
          .github/scripts/api-commit.sh \
            --branch "$branch" \
            --message "chore(harness): regenerate model catalogue" \
            -- packages/harness/src/models/generated
          gh pr create --title "chore(harness): regenerate model catalogue" \
            --body "Automated refresh from models.dev + api.inference.net. Queued for auto-merge; lands once ci is green."
          pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          gh pr merge --squash --auto "$pr"
