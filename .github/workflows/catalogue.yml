name: catalogue

# Keeps main's model catalogue fresh without pushing to main (the ruleset's required ci
# check makes direct pushes impossible). refresh opens a PR on drift; merge lands it once
# that PR's own ci run is green. The two jobs are one handshake because allow_auto_merge
# is off on the repo — enable it and merge collapses into `gh pr merge --auto` in refresh.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: ['catalogue/**']

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: regenerate and open a PR on drift
        run: |
          set -euo pipefail
          (cd packages/harness && bun run generate:catalogue)
          if git diff --quiet -- packages/harness/src/models/generated; then
            echo "catalogue is fresh"
            exit 0
          fi
          branch="catalogue/$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packages/harness/src/models/generated
          git commit -m "chore(harness): regenerate model catalogue"
          git push origin "$branch"
          gh pr create --title "chore(harness): regenerate model catalogue" \
            --body "Automated refresh from models.dev + api.inference.net. Merged by the catalogue workflow once its ci run is green."

  merge:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # Mergeability is computed asynchronously — seconds after the checks go green the
      # merge can still be refused, so retry briefly before giving up.
      - run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh pr merge --squash --delete-branch "$BRANCH"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::catalogue PR for $BRANCH would not merge after ci went green"
          exit 1
