name: codex-version

# Tracks the latest openai/codex CLI release (rust-vX.Y.Z tags) and opens a PR when the pinned
# CODEX_VERSION drifts, then queues it for auto-merge: GitHub lands it once ci is green. The
# commit is created through the REST git API (api-commit.sh) so GitHub web-signs it — Vercel
# refuses to build unsigned commits. The automerge workflow unsticks held runs and conflicts.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install

      - name: bump the pinned version and open a PR on drift
        run: |
          set -euo pipefail
          (cd packages/harness && bun run generate:codex-version)
          pinned=packages/harness/src/providers/codex-version.ts
          if git diff --quiet -- "$pinned"; then
            echo "codex client version is fresh"
            exit 0
          fi
          version=$(grep -o "CODEX_VERSION = '[^']*'" "$pinned" | cut -d"'" -f2)
          branch="codex-version/$version"
          .github/scripts/api-commit.sh \
            --branch "$branch" \
            --message "fix(harness): bump codex client version to $version" \
            -- "$pinned"
          gh pr create \
            --title "fix(harness): bump codex client version to $version" \
            --body "Automated bump of \`CODEX_VERSION\` to the latest \`openai/codex\` CLI release ($version). Queued for auto-merge; lands once ci is green."
          gh pr merge --squash --auto "$(gh pr list --head "$branch" --json number --jq '.[0].number')"
