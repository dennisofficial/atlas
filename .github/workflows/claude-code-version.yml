name: claude-code-version

# Tracks the latest @anthropic-ai/claude-code release on npm and opens a PR when the pinned
# CLAUDE_CODE_VERSION drifts, then queues it for auto-merge: GitHub lands it once ci is
# green. The commit is created through the REST git API (api-commit.sh) so GitHub web-signs
# it — Vercel refuses to build unsigned commits. The automerge workflow unsticks held runs
# and conflicts.
on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install

      - name: bump the pinned version and open a PR on drift
        run: |
          set -euo pipefail
          (cd packages/harness && bun run generate:claude-code-version)
          attribution=packages/harness/src/providers/anthropic-subscription-attribution.ts
          if git diff --quiet -- "$attribution"; then
            echo "claude code attribution version is fresh"
            exit 0
          fi
          version=$(grep -o "CLAUDE_CODE_VERSION = '[^']*'" "$attribution" | cut -d"'" -f2)
          branch="claude-code-version/$version"
          .github/scripts/api-commit.sh \
            --branch "$branch" \
            --message "fix(harness): bump claude code attribution version to $version" \
            -- "$attribution"
          gh pr create \
            --title "fix(harness): bump claude code attribution version to $version" \
            --body "Automated bump of \`CLAUDE_CODE_VERSION\` to the latest \`@anthropic-ai/claude-code\` release ($version). Queued for auto-merge; lands once ci is green."
          gh pr merge --squash --auto "$(gh pr list --head "$branch" --json number --jq '.[0].number')"
