name: mobile-update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/ui/src/tokens/**'
      - 'packages/api-router/**'
      - 'packages/wire/**'
      - 'bun.lock'
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS Update channel to publish to'
        required: true
        default: 'production'
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when EAS is not configured
        if: ${{ vars.EAS_PROJECT_ID == '' || secrets.EXPO_TOKEN == '' }}
        run: |
          echo '::notice::EAS_PROJECT_ID or EXPO_TOKEN is not set; skipping the mobile update publish.'
      - name: Guard
        if: ${{ vars.EAS_PROJECT_ID == '' || secrets.EXPO_TOKEN == '' }}
        run: exit 0
      - uses: actions/checkout@v4
        if: ${{ vars.EAS_PROJECT_ID != '' && secrets.EXPO_TOKEN != '' }}
      - uses: oven-sh/setup-bun@v2.2.0
        if: ${{ vars.EAS_PROJECT_ID != '' && secrets.EXPO_TOKEN != '' }}
      - name: Install dependencies
        if: ${{ vars.EAS_PROJECT_ID != '' && secrets.EXPO_TOKEN != '' }}
        run: bun install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        if: ${{ vars.EAS_PROJECT_ID != '' && secrets.EXPO_TOKEN != '' }}
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish EAS Update
        if: ${{ vars.EAS_PROJECT_ID != '' && secrets.EXPO_TOKEN != '' }}
        working-directory: apps/mobile
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: eas update --channel ${{ github.event.inputs.channel || 'production' }} --environment production --auto --non-interactive
