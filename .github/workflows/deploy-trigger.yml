name: deploy-trigger

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/wire/**
      - package.json
      - bun.lock
      - bunfig.toml
      - tsconfig.base.json
      - .github/workflows/deploy-trigger.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-trigger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun run db:generate

      # The CLI authenticates from TRIGGER_ACCESS_TOKEN (a tr_pat_ personal token) and reads the
      # project ref from trigger.config.ts; --profile only selects a local login.
      - name: deploy tasks to prod
        run: bun run trigger:deploy:ci
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

      - name: smoke the deployed worker
        timeout-minutes: 4
        run: |
          key=$(./node_modules/.bin/dotenvx get TRIGGER_SECRET_KEY -f envs/.env.api.production.enc)
          echo "::add-mask::$key"
          TRIGGER_SECRET_KEY="$key" bun run trigger:smoke
        env:
          DOTENV_PRIVATE_KEY_API_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_API_PRODUCTION }}
