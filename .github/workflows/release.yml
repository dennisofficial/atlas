name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy-preview-worker: ${{ steps.diff.outputs.deploy-preview-worker }}
      deploy-artifacts-worker: ${{ steps.diff.outputs.deploy-artifacts-worker }}
      deploy-install-worker: ${{ steps.diff.outputs.deploy-install-worker }}
    steps:
      - uses: actions/checkout@v7

      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          worker='^(apps/preview-worker/|\.github/workflows/release\.yml$)'
          artifacts='^(apps/artifacts-host/|packages/artifacts/|\.github/workflows/release\.yml$)'
          install='^(scripts/install-worker/|\.github/workflows/release\.yml$)'
          if [ "$EVENT" = "workflow_dispatch" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "deploy-preview-worker=true" >> "$GITHUB_OUTPUT"
            echo "deploy-artifacts-worker=true" >> "$GITHUB_OUTPUT"
            echo "deploy-install-worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if echo "$changed" | grep -Eq "$worker"; then
            echo "deploy-preview-worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-preview-worker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq "$artifacts"; then
            echo "deploy-artifacts-worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-artifacts-worker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq "$install"; then
            echo "deploy-install-worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-install-worker=false" >> "$GITHUB_OUTPUT"
          fi

  # Render pulls a prebuilt image, so it spends no build minutes: this workflow builds the image,
  # migrates, then deploys the image of this commit. The release concurrency group keeps one run
  # pending, so a burst of merges deploys only the newest commit. A failed migration stops the
  # deploy and the previous instance keeps serving.
  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-api
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/api/docker/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: ATLAS_APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: migrate the production database and verify it matches the contract
        run: bun run --cwd apps/api db:migrate:predeploy
        env:
          APP_TIER: production
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ENC }}

  render-deploy:
    needs: [api-image, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: deploy the image of this commit on Render
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"imageUrl\":\"ghcr.io/${{ github.repository_owner }}/atlas-api:$GITHUB_SHA\"}"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbuu4tui0phs73ercifg

  # Waits for the deploy of this commit to be live before trigger.dev tasks and the web reach it.
  render-live:
    needs: render-deploy
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - name: wait for the Render deploy of this commit to go live
        run: bun scripts/render-deploy-gate.ts
        working-directory: apps/api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbuu4tui0phs73ercifg

  # Vercel builds every main push as a staged production deployment (the web project's "Auto-assign
  # Custom Production Domains" is off), so byatlas.io moves to a commit only once the API that commit
  # talks to is live. Unset VERCEL_WEB_PROJECT and the job is skipped.
  web-live:
    needs: render-live
    if: ${{ !cancelled() && !failure() && vars.VERCEL_WEB_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - name: promote this commit's staged web build
        run: bun scripts/vercel-promote-gate.ts
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_WEB_PROJECT: ${{ vars.VERCEL_WEB_PROJECT }}

  deploy-preview-worker:
    needs: changes
    if: needs.changes.outputs.deploy-preview-worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/preview-worker
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun test

      - name: deploy the worker in front of *.byatlas.dev
        run: bun run deploy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.PREVIEW_WORKER_DOTENV_PRIVATE_KEY }}

  deploy-artifacts-worker:
    needs: changes
    if: needs.changes.outputs.deploy-artifacts-worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/artifacts-host
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun test

      - name: read the Cloudflare token from this app's own tier
        run: |
          token=$(../../node_modules/.bin/dotenvx get CLOUDFLARE_API_TOKEN -f .env.production.enc)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.ARTIFACTS_HOST_DOTENV_PRIVATE_KEY }}

      - name: deploy the worker in front of *.byatlas.site
        run: bun run deploy

  # install.byatlas.io serves install.sh and every release download, so its deploy is its own job:
  # a broken worker edit fails here instead of shipping beside an unrelated one.
  deploy-install-worker:
    needs: changes
    if: needs.changes.outputs.deploy-install-worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - run: bun test ./scripts/install-worker

      - name: deploy the worker in front of install.byatlas.io
        run: >-
          ./node_modules/.bin/dotenvx run -f scripts/install-worker/.env.production.enc --
          bun scripts/install-worker/deploy.ts
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.INSTALL_WORKER_DOTENV_PRIVATE_KEY }}
