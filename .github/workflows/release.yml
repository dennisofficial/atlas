name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy-trigger: ${{ steps.diff.outputs.deploy-trigger }}
      deploy-preview-worker: ${{ steps.diff.outputs.deploy-preview-worker }}
      deploy-artifacts-worker: ${{ steps.diff.outputs.deploy-artifacts-worker }}
    steps:
      - uses: actions/checkout@v7

      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          trigger='^(apps/api/|packages/wire/|packages/db/|package\.json$|bun\.lock$|bunfig\.toml$|tsconfig\.base\.json$|\.github/workflows/release\.yml$)'
          worker='^(apps/preview-worker/|\.github/workflows/release\.yml$)'
          artifacts='^(apps/artifacts-host/|packages/artifacts/|\.github/workflows/release\.yml$)'
          if [ "$EVENT" = "workflow_dispatch" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "deploy-trigger=true" >> "$GITHUB_OUTPUT"
            echo "deploy-preview-worker=true" >> "$GITHUB_OUTPUT"
            echo "deploy-artifacts-worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if echo "$changed" | grep -Eq "$trigger"; then
            echo "deploy-trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-trigger=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq "$worker"; then
            echo "deploy-preview-worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-preview-worker=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq "$artifacts"; then
            echo "deploy-artifacts-worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy-artifacts-worker=false" >> "$GITHUB_OUTPUT"
          fi

  # With RENDER_DEPLOY_FROM_CI set, Render's auto-deploy and pre-deploy command are off and this
  # workflow drives the API release: migrate, then deploy this commit. The release concurrency group
  # keeps one run pending, so a burst of merges deploys only the newest commit. A failed migration
  # stops the deploy and the previous instance keeps serving.
  migrate:
    if: vars.RENDER_DEPLOY_FROM_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: migrate the production database and verify it matches the contract
        run: bun run --cwd apps/api db:migrate:predeploy
        env:
          APP_TIER: production
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ENC }}

  render-deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: deploy this commit on Render
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "authorization: Bearer $RENDER_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"commitId\":\"$GITHUB_SHA\",\"clearCache\":\"do_not_clear\"}"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbmaj7ajnfac738tg30g

  # Without RENDER_DEPLOY_FROM_CI, Render deploys every push itself and runs the migration as its
  # pre-deploy command. Either way this job waits for the deploy of this commit to be live before
  # trigger.dev tasks and the web reach it.
  render-live:
    needs: render-deploy
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - name: wait for the Render deploy of this commit to go live
        run: bun scripts/render-deploy-gate.ts
        working-directory: apps/api
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbmaj7ajnfac738tg30g

  # Vercel builds every main push as a staged production deployment (the web project's "Auto-assign
  # Custom Production Domains" is off), so byatlas.io moves to a commit only once the API that commit
  # talks to is live. Unset VERCEL_WEB_PROJECT and the job is skipped.
  web-live:
    needs: render-live
    if: ${{ !cancelled() && !failure() && vars.VERCEL_WEB_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - name: promote this commit's staged web build
        run: bun scripts/vercel-promote-gate.ts
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_WEB_PROJECT: ${{ vars.VERCEL_WEB_PROJECT }}

  deploy-trigger:
    needs: [changes, render-live]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.deploy-trigger == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        working-directory: .

      # The CLI authenticates from TRIGGER_ACCESS_TOKEN (a tr_pat_ personal token) and reads the
      # project ref from trigger.config.ts; --profile only selects a local login.
      - name: deploy tasks to prod
        run: bun run trigger:deploy:ci
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

      - name: smoke the deployed worker
        timeout-minutes: 4
        run: |
          key=$(./node_modules/.bin/dotenvx get TRIGGER_SECRET_KEY -f .env.production.enc)
          echo "::add-mask::$key"
          TRIGGER_SECRET_KEY="$key" bun run trigger:smoke
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ENC }}

  deploy-preview-worker:
    needs: changes
    if: needs.changes.outputs.deploy-preview-worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/preview-worker
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun test

      - name: deploy the worker in front of *.byatlas.dev
        run: bun run deploy
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.PREVIEW_WORKER_DOTENV_PRIVATE_KEY }}

  deploy-artifacts-worker:
    needs: changes
    if: needs.changes.outputs.deploy-artifacts-worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/artifacts-host
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun test

      - name: read the Cloudflare token from this app's own tier
        run: |
          token=$(../../node_modules/.bin/dotenvx get CLOUDFLARE_API_TOKEN -f .env.production.enc)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.ARTIFACTS_HOST_DOTENV_PRIVATE_KEY }}

      - name: deploy the worker in front of *.byatlas.site
        run: bun run deploy
