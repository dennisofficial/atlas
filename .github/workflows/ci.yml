name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; the release job declares its own write permissions so the test and
# build jobs keep running with a read-only token.
permissions:
  contents: read
  packages: read

env:
  ATLAS_HOME: ${{ github.workspace }}/.atlas-home
  NODE_ENV: development

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install

      # The VCR image-push token doubles as the turbo cache token — same comp-ai team
      # scope. Absent on fork PRs, which then simply run uncached.
      - name: enable turbo remote cache
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "TURBO_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"
            echo "TURBO_TEAM=comp-ai" >> "$GITHUB_ENV"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: typecheck
        run: bun run typecheck

      - name: build binary
        run: bun run build

      - name: build serve binary
        run: bun run build:serve
        working-directory: apps/serve

  # One TUI shard per runner: parallel bun processes on one 4-core runner starve the
  # settle-based render specs into flakes, but separate runners have separate cores
  test-tui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install

      - name: tui shard ${{ matrix.shard }} of 4
        run: bun run test
        working-directory: apps/tui
        env:
          ATLAS_TEST_SHARDS: '4'
          ATLAS_TEST_SHARD: ${{ matrix.shard }}
          ATLAS_TESTING: '1'

  test-packages:
    runs-on: ubuntu-latest
    env:
      ATLAS_LIVE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: enable turbo remote cache
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "TURBO_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"
            echo "TURBO_TEAM=comp-ai" >> "$GITHUB_ENV"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull test images
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/atlas-sandbox:latest
          docker pull node:22-slim

      - name: test core, harness, ui, api
        run: bun run test --filter='!@dltech/atlas' --concurrency 1 --output-logs=full

  # The api image is the deploy artifact, and its runtime stage copies explicit paths — a
  # path-loaded asset missing from that list builds fine and only fails at deploy time (#474).
  build-api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: atlas-api-ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

      - name: smoke-check the migrate entry
        run: docker run --rm atlas-api-ci node --check scripts/migrate-deploy.mjs

  # Single required status for the main ruleset: one name covers every job above, so tightening
  # CI never leaves the ruleset behind. Named `ci` only on pull_request runs — a required check is
  # satisfied by whichever run reports the name first on a sha, and the push run's answers are not
  # the PR run's (ortho-backend-v3 learned this on a promotion PR mergeable four seconds after
  # opening).
  ci:
    name: ${{ github.event_name == 'pull_request' && 'ci' || 'ci (post-merge)' }}
    runs-on: ubuntu-latest
    needs: [check, test-packages, test-tui, build-api-image]
    if: always()
    steps:
      - name: Fail if any check failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more CI checks failed"
            exit 1
          fi
          echo "all CI checks passed"

  # Releasing is a job of the same run that proved the commit green, not a second workflow
  # triggered by workflow_run: under workflow_run the tag's target was the triggering ci run's
  # head_sha, a snapshot of history that a merge landing while ci was still running silently
  # invalidated — tui-v1.20.2 was tagged one commit behind the merge that shipped it that way
  # (2026-09-28, run 36483286193). Here the tag's target is github.sha, main's HEAD by
  # construction, so the stale-gating-run case cannot exist. The concurrency group is keyed to
  # main only: a fresher push cancels an in-flight build and its own run re-derives the same
  # semver from the last tag, so the release rides the fresher commit with the version number
  # unchanged. PR runs never enter the group — the job-level `if` skips them before the
  # concurrency group is claimed — so they cannot cancel a main build or each other.
  release:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-main
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0

      # Cross-compiles three targets from one ubuntu host, and @vscode/ripgrep ships its binaries
      # as os/cpu-gated optional packages — without the overrides only the host's rg is installed
      # and staging the vendored binary for the darwin targets fails.
      - run: bun install --os='*' --cpu='*'

      - name: compute release version
        id: version
        run: bun apps/tui/scripts/release-version.ts >> "$GITHUB_OUTPUT"

      - name: build binaries
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/tui
        env:
          ATLAS_VERSION: ${{ steps.version.outputs.version }}
          ATLAS_RELEASE_REPO: ${{ github.repository }}
          ATLAS_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bun run build:prepare
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64; do
            asset="atlas-${target#bun-}"
            bun scripts/build.ts --target "$target" --outfile "dist/${asset}"
            shasum -a 256 "dist/${asset}" > "dist/${asset}.sha256"
          done

      - name: create release
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/tui
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # --target pins the tag to the commit these binaries were built from: without it
          # gh release create tags the default branch's HEAD at creation time, and a merge
          # that lands while this run is building would tag a commit past the built one.
          args=(--title "atlas v${VERSION}" --generate-notes --target "$TARGET_SHA")
          if [[ -n "$PREV_TAG" ]]; then
            args+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "tui-v${VERSION}" dist/* "${args[@]}"

      - name: dispatch sandbox image retag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run sandbox-image.yml -f release_tag="tui-v${VERSION}" -f release_sha="$TARGET_SHA"
