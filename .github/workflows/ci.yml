name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Write scopes live on the release job, never at workflow level: GITHUB_TOKEN is minted per
# job, so the test and build jobs run with a read-only token even if a job is added later.
permissions:
  contents: read
  packages: read

env:
  ATLAS_HOME: ${{ github.workspace }}/.atlas-home
  NODE_ENV: development

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install

      # The VCR image-push token doubles as the turbo cache token — same comp-ai team
      # scope. Absent on fork PRs, which then simply run uncached.
      - name: enable turbo remote cache
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "TURBO_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"
            echo "TURBO_TEAM=comp-ai" >> "$GITHUB_ENV"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: typecheck
        run: bun run typecheck

      - name: build binary
        run: bun run build

      # A bundled binary can crash at module evaluation where source runs fine — tui-v1.119.0
      # shipped tsyringe evaluating before its reflect polyfill — so run the built artifact once.
      - name: smoke-run the binary
        run: ./bin/atlas --version
        working-directory: apps/tui

      - name: build serve binary
        run: bun run build:serve
        working-directory: apps/serve

      - name: fetch every platform's optional binaries
        run: bun install --os='*' --cpu='*'

      - name: build serve binary (linux-arm64)
        run: bun run build:serve -- --target bun-linux-arm64 --outfile "$RUNNER_TEMP/atlas-serve-linux-arm64"
        working-directory: apps/serve

  # Every test suite in one job, made incremental by @dltech/vitest-incremental: a test file runs only
  # when it has no cached pass for its exact current inputs (modules loaded, files read, env read), so
  # there is no paths filter and no sharding. Each run saves a new immutable cache keyed by run id;
  # restore picks the newest for this ref, then main's. GitHub scopes caches by ref, so a PR reads
  # main's cache but main never reads a PR's — never move this to pull_request_target.
  # tests-nightly.yml runs everything nightly and fails if the cache ever hid a failure.
  test:
    runs-on: ubuntu-latest
    env:
      VITEST_INCREMENTAL: ${{ github.event_name == 'workflow_dispatch' && 'force' || '1' }}
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:55441/atlas_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install

      - name: restore incremental test cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/incremental-tests
          key: incremental-tests-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            incremental-tests-${{ github.ref }}-
            incremental-tests-refs/heads/main-

      - name: test (bun runtime)
        id: bun-tests
        run: bun --bun vitest run
        env:
          VITEST_INCREMENTAL_SUMMARY: ${{ runner.temp }}/summary-bun.json

      # api stays on Node: vitest needs unplugin-swc for Nest's decorator metadata.
      - name: test api (node runtime)
        if: always() && steps.restore.outcome == 'success'
        working-directory: apps/api
        run: bun run test
        env:
          VITEST_INCREMENTAL_SUMMARY: ${{ runner.temp }}/summary-api.json

      # The plugin's own suite drives child vitest runs, so it is never incremental; turbo's remote
      # cache keys it on the package's sources instead.
      - name: test the incremental plugin itself
        if: always() && steps.restore.outcome == 'success'
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then export TURBO_TOKEN="$VERCEL_TOKEN" TURBO_TEAM=comp-ai; fi
          bunx turbo run test --filter @dltech/vitest-incremental --output-logs=errors-only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITEST_INCREMENTAL: ''

      - name: report
        if: always()
        run: .github/scripts/incremental-report.sh .cache/incremental-tests "$RUNNER_TEMP"/summary-*.json

      # Saved even when tests fail: passes stay valid and failures are never stored.
      - name: save incremental test cache
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-tests
          key: incremental-tests-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The api image is the deploy artifact, and its runtime stage copies explicit paths — a
  # path-loaded asset missing from that list builds fine and only fails at deploy time (#474).
  build-api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build the api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: atlas-api-ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

      - name: smoke-check the migrate entry
        run: docker run --rm atlas-api-ci node --check scripts/migrate-deploy.mjs

      - name: check the image carries the migrate job's tools and the runtime
        run: docker run --rm atlas-api-ci sh -c 'node --version && npm --version && bun --version && npx --no-install dotenvx --version && cd ../../packages/db && bun run --bun prisma --version'

      - name: boot the image and probe it
        run: |
          docker run -d --name atlas-api-probe -p 3400:3400 \
            -e APP_TIER=local \
            -e PORT=3400 \
            -e DATABASE_URL=postgresql://atlas:atlas@127.0.0.1:1/atlas \
            -e SECRET_KEY=test-secret-key-with-at-least-32-characters \
            -e WEB_ORIGIN=http://localhost:3001 \
            -e BETTER_AUTH_URL=http://localhost:3400 \
            -e SECRETS_ENCRYPTION_KEY=a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2 \
            -e TRIGGER_SECRET_KEY=tr_dev_test-fixture-not-a-real-key \
            atlas-api-ci
          health=$(curl -s -o /dev/null -w '%{http_code}' --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3400/v1/health || true)
          secrets=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3400/v1/secrets || true)
          if [ "$health" != "200" ] || [ "$secrets" != "401" ]; then
            echo "::error::/v1/health=$health (want 200), /v1/secrets=$secrets (want 401)"
            docker logs atlas-api-probe
            exit 1
          fi

  # Single required status for the main ruleset: one name covers every job above, so tightening
  # CI never leaves the ruleset behind. Named `ci` only on pull_request runs — a required check is
  # satisfied by whichever run reports the name first on a sha, and the push run's answers are not
  # the PR run's (ortho-backend-v3 learned this on a promotion PR mergeable four seconds after
  # opening).
  ci:
    name: ${{ github.event_name == 'pull_request' && 'ci' || 'ci (post-merge)' }}
    runs-on: ubuntu-latest
    needs: [check, test, build-api-image]
    if: always()
    steps:
      - name: Fail if any check failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::one or more CI checks failed"
            exit 1
          fi
          echo "all CI checks passed"

  # Releasing is a job of the same run that proved the commit green, not a second workflow
  # triggered by workflow_run: under workflow_run the tag's target was the triggering ci run's
  # head_sha, a snapshot of history that a merge landing while ci was still running silently
  # invalidated — tui-v1.20.2 was tagged one commit behind the merge that shipped it that way
  # (2026-09-28, run 36483286193). Here the tag's target is github.sha, main's HEAD by
  # construction, so the stale-gating-run case cannot exist. A fresher push cancels an in-flight
  # build and its own run re-derives the version from the last tag, so no commit's
  # release-worthiness is lost — the number itself may differ (a feat in the fresher push bumps
  # minor where the cancelled run would have cut a patch), and that is correct. The group name
  # carries the ref so a skipped PR job, which claims no group, can never cancel a main build
  # even if GitHub's if-evaluation timing changes.
  release:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0

      # Cross-compiles three targets from one ubuntu host, and @vscode/ripgrep ships its binaries
      # as os/cpu-gated optional packages — without the overrides only the host's rg is installed
      # and staging the vendored binary for the darwin targets fails.
      - run: bun install --os='*' --cpu='*'

      - name: compute release version
        id: version
        run: bun apps/tui/scripts/release-version.ts >> "$GITHUB_OUTPUT"

      - name: build binaries
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/tui
        env:
          ATLAS_VERSION: ${{ steps.version.outputs.version }}
          ATLAS_RELEASE_REPO: ${{ github.repository }}
          ATLAS_BUILD_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          bun run build:prepare
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64; do
            asset="atlas-${target#bun-}"
            bun scripts/build.ts --target "$target" --outfile "dist/${asset}"
            shasum -a 256 "dist/${asset}" > "dist/${asset}.sha256"
          done

      - name: build serve binary
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/serve
        run: |
          set -euo pipefail
          bun run build:serve -- --target bun-linux-x64 --outfile dist/atlas-serve-linux-x64
          bun run build:serve -- --target bun-linux-arm64 --outfile dist/atlas-serve-linux-arm64
          shasum -a 256 dist/atlas-serve-linux-x64 > dist/atlas-serve-linux-x64.sha256
          shasum -a 256 dist/atlas-serve-linux-arm64 > dist/atlas-serve-linux-arm64.sha256

      - name: create release
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/tui
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # --target pins the tag to the commit these binaries were built from: without it
          # gh release create tags the default branch's HEAD at creation time, and a merge
          # that lands while this run is building would tag a commit past the built one.
          args=(--title "atlas v${VERSION}" --generate-notes --target "$TARGET_SHA")
          if [[ -n "$PREV_TAG" ]]; then
            args+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "tui-v${VERSION}" dist/* \
            ../serve/dist/atlas-serve-linux-x64 ../serve/dist/atlas-serve-linux-x64.sha256 \
            ../serve/dist/atlas-serve-linux-arm64 ../serve/dist/atlas-serve-linux-arm64.sha256 \
            "${args[@]}"

      - name: dispatch sandbox image retag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run sandbox-image.yml -f release_tag="tui-v${VERSION}" -f release_sha="$TARGET_SHA"
