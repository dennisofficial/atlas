name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  ATLAS_HOME: ${{ github.workspace }}/.atlas-home
  NODE_ENV: development

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: typecheck
        run: bun run typecheck

      - name: build binary
        run: bun run build

  # One TUI shard per runner: parallel bun processes on one 4-core runner starve the
  # settle-based render specs into flakes, but separate runners have separate cores
  test-tui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: generate the harness prisma client
        run: bun run db:ensure
        working-directory: packages/harness

      - name: tui shard ${{ matrix.shard }} of 2
        run: bun run test
        working-directory: apps/tui
        env:
          ATLAS_TEST_SHARDS: '2'
          ATLAS_TEST_SHARD: ${{ matrix.shard }}

  test-packages:
    runs-on: ubuntu-latest
    env:
      ATLAS_LIVE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull test images
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/atlas-sandbox:latest
          docker pull node:22-slim

      - name: test core, harness, ui, api
        run: bun run test --filter='!@dltech/atlas' --concurrency 1 --output-logs=full
