name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ATLAS_HOME: ${{ github.workspace }}/.atlas-home
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull sandbox image
        run: docker pull ghcr.io/${{ github.repository_owner }}/atlas-sandbox:latest

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

      - name: build binary
        run: bun run build
