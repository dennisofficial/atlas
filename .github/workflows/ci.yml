name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Write scopes live on the release job, never at workflow level: GITHUB_TOKEN is minted per
# job, so the test and build jobs run with a read-only token even if a job is added later.
permissions:
  contents: read
  packages: read

env:
  ATLAS_HOME: ${{ github.workspace }}/.atlas-home
  NODE_ENV: development

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RENDER_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      RENDER_CHECK_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install

      - name: lint and format
        run: bun run lint

      # The VCR image-push token doubles as the turbo cache token — same comp-ai team
      # scope. Absent on fork PRs, which then simply run uncached.
      - name: enable turbo remote cache
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "TURBO_TOKEN=$VERCEL_TOKEN" >> "$GITHUB_ENV"
            echo "TURBO_TEAM=comp-ai" >> "$GITHUB_ENV"
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: typecheck
        run: bun run typecheck

      - name: generated AppRouter matches the routers
        run: |
          bun run --cwd apps/api generate:trpc
          if [ -n "$(git status --porcelain packages/api-router/src/generated)" ]; then
            git --no-pager diff packages/api-router/src/generated
            echo "::error::packages/api-router/src/generated is stale; run 'bun run --cwd apps/api generate:trpc' and commit it"
            exit 1
          fi

      - name: build binary
        run: bun run build

      # A bundled binary can crash at module evaluation where source runs fine — tui-v1.119.0
      # shipped tsyringe evaluating before its reflect polyfill — so run the built artifact once.
      - name: smoke-run the binary
        run: ./bin/atlas --version
        working-directory: apps/tui

      - name: build serve binary
        run: bun run build:serve
        working-directory: apps/serve

      - name: fetch every platform's optional binaries
        run: bun install --os='*' --cpu='*'

      - name: build serve binary (linux-arm64)
        run: bun run build:serve -- --target bun-linux-arm64 --outfile "$RUNNER_TEMP/atlas-serve-linux-arm64"
        working-directory: apps/serve

      - name: fetch the diff base
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.event.before, '0000000')
        run: git fetch --no-tags --depth=1 origin "$RENDER_CHECK_BASE" || echo "RENDER_CHECK_ALL=1" >> "$GITHUB_ENV"

      # The pull_request checkout is the merge commit, so base.sha..HEAD is exactly the PR's diff
      # and a tree diff needs no history on a shallow clone.
      - name: plan storybook render check
        id: render-plan
        run: bun run render-check plan
        working-directory: apps/storybook

      - name: cache playwright browsers
        if: steps.render-plan.outputs.count != '0'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: install chromium
        if: steps.render-plan.outputs.count != '0'
        run: bunx playwright install --with-deps chromium
        working-directory: apps/storybook

      - name: render affected stories
        if: steps.render-plan.outputs.count != '0'
        run: bun run render-check
        working-directory: apps/storybook

  # Every test suite in one job, made incremental by bun-test-incremental (a bun:test preload): a spec
  # runs only when `bun test --changed` selects it from the git diff AND it has no cached pass for its
  # exact current inputs (fingerprint pass-cache; failed tests are never cached, so they re-run until
  # green). There is no paths filter and no sharding. Each run saves a new immutable cache keyed by
  # run id; restore picks the newest for this ref, then main's. GitHub scopes caches by ref, so a PR
  # reads main's cache but main never reads a PR's — never move this to pull_request_target.
  # tests-nightly.yml runs everything nightly and fails if the cache ever hid a failure.
  test:
    runs-on: ubuntu-latest
    env:
      BUN_TEST_INCREMENTAL: ${{ github.event_name == 'workflow_dispatch' && 'force' || '1' }}
      TEST_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:55441/atlas_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install

      - name: restore incremental test cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/incremental-tests
          key: incremental-tests-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            incremental-tests-${{ github.ref }}-
            incremental-tests-refs/heads/main-

      # Same base as the render check: the PR's base sha, or the previous main HEAD on push. When
      # the base cannot be fetched the suite runs without --changed and the pass-cache alone decides.
      - name: fetch the diff base
        id: diff-base
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.event.before, '0000000')
        run: |
          if git fetch --no-tags --depth=1 origin "$TEST_DIFF_BASE"; then
            echo "changed=--changed=$TEST_DIFF_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not fetch $TEST_DIFF_BASE; running without --changed"
          fi

      # Each package's `test` script is `bun test` run from the package, so its bunfig.toml preload
      # (bun-test.setup.ts + the bun-test-incremental preload + any test-home-setup.ts) applies. A
      # single `bun test` from the root would skip those preloads and sweep in deprecated/. evals
      # keeps its vitest script (evalite). The incremental preload is inert unless BUN_TEST_INCREMENTAL
      # is set, and each package writes one summary JSON to the summary dir.
      # bun-test-incremental's own suite drives child `bun test` runs, so it must never run
      # incrementally against itself; it is excluded here and run in its own step below.
      - name: test
        run: bun run --filter './packages/*' --filter './apps/*' --filter './evals' --filter '!@dltech/bun-test-incremental' test ${CHANGED_ARG:+"$CHANGED_ARG"}
        env:
          BUN_TEST_INCREMENTAL_SUMMARY_DIR: ${{ runner.temp }}/summaries
          CHANGED_ARG: ${{ steps.diff-base.outputs.changed }}

      # The incremental package's own suite spawns child `bun test` runs, so it runs with
      # BUN_TEST_INCREMENTAL unset (the child runs set it themselves as the thing under test).
      - name: test the incremental package itself
        if: always() && steps.restore.outcome == 'success'
        working-directory: packages/bun-test-incremental
        run: bun test
        env:
          BUN_TEST_INCREMENTAL: ''

      - name: report
        if: always()
        run: .github/scripts/incremental-report.sh .cache/incremental-tests "$RUNNER_TEMP"/summaries/*.json

      # Saved even when tests fail: passes stay valid and failures are never stored.
      - name: save incremental test cache
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-tests
          key: incremental-tests-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

  api-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: vercel bundle spec
        run: bun test src/vercel-bundle.integration.spec.ts
        working-directory: apps/api
        env:
          ATLAS_LIVE_DOCKER: '1'

  # Unsigned rehearsal of the mac build on every PR and main push: proves the web export, main
  # bundle and Hutch packaging still work without touching a secret, so fork PRs run it too and
  # it gates merges. Signing and notarization happen only in `mac-release`. Hutch builds for the
  # host only, so this runs on the arm64 mac runner.
  mac-app-rehearsal:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ATLAS_MAC_UNSIGNED: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/src/**', 'apps/web/*.ts', 'apps/web/*.mjs', 'apps/web/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-

      - name: restore hutch
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ hashFiles('apps/mac/hutch.config.ts', 'bun.lock') }}

      - name: install create-dmg
        run: command -v create-dmg >/dev/null || brew install create-dmg

      - name: build unsigned app
        run: bun run build:app
        working-directory: apps/mac

      - name: list artifacts
        run: ls -la artifacts
        working-directory: apps/mac

  # Single required status for the main ruleset: one name covers every job above, so tightening
  # CI never leaves the ruleset behind. Named `ci` only on pull_request runs — a required check is
  # satisfied by whichever run reports the name first on a sha, and the push run's answers are not
  # the PR run's (ortho-backend-v3 learned this on a promotion PR mergeable four seconds after
  # opening).
  ci:
    name: ${{ github.event_name == 'pull_request' && 'ci' || 'ci (post-merge)' }}
    runs-on: ubuntu-latest
    needs: [check, test, api-bundle, mac-app-rehearsal]
    if: always()
    steps:
      - name: Fail if any check failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::one or more CI checks failed"
            exit 1
          fi
          echo "all CI checks passed"

  # Releasing is a job of the same run that proved the commit green, not a second workflow
  # triggered by workflow_run: under workflow_run the tag's target was the triggering ci run's
  # head_sha, a snapshot of history that a merge landing while ci was still running silently
  # invalidated — tui-v1.20.2 was tagged one commit behind the merge that shipped it that way
  # (2026-09-28, run 36483286193). Here the tag's target is github.sha, main's HEAD by
  # construction, so the stale-gating-run case cannot exist. A fresher push cancels an in-flight
  # build and its own run re-derives the version from the last tag, so no commit's
  # release-worthiness is lost — the number itself may differ (a feat in the fresher push bumps
  # minor where the cancelled run would have cut a patch), and that is correct. The group name
  # carries the ref so a skipped PR job, which claims no group, can never cancel a main build
  # even if GitHub's if-evaluation timing changes.
  release:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.version.outputs.skip != 'true' && format('tui-v{0}', steps.version.outputs.version) || '' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0

      # Cross-compiles three targets from one ubuntu host, and @vscode/ripgrep ships its binaries
      # as os/cpu-gated optional packages — without the overrides only the host's rg is installed
      # and staging the vendored binary for the darwin targets fails.
      - run: bun install --os='*' --cpu='*'

      - name: compute release version
        id: version
        run: bun apps/tui/scripts/release-version.ts >> "$GITHUB_OUTPUT"

      - name: build binaries
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/tui
        env:
          ATLAS_VERSION: ${{ steps.version.outputs.version }}
          ATLAS_RELEASE_REPO: ${{ github.repository }}
          ATLAS_BUILD_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          bun run build:prepare
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64; do
            asset="atlas-${target#bun-}"
            bun scripts/build.ts --target "$target" --outfile "dist/${asset}"
            shasum -a 256 "dist/${asset}" > "dist/${asset}.sha256"
          done

      - name: build serve binary
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/serve
        run: |
          set -euo pipefail
          bun run build:serve -- --target bun-linux-x64 --outfile dist/atlas-serve-linux-x64
          bun run build:serve -- --target bun-linux-arm64 --outfile dist/atlas-serve-linux-arm64
          shasum -a 256 dist/atlas-serve-linux-x64 > dist/atlas-serve-linux-x64.sha256
          shasum -a 256 dist/atlas-serve-linux-arm64 > dist/atlas-serve-linux-arm64.sha256

      - name: create release
        if: steps.version.outputs.skip != 'true'
        working-directory: apps/tui
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # --target pins the tag to the commit these binaries were built from: without it
          # gh release create tags the default branch's HEAD at creation time, and a merge
          # that lands while this run is building would tag a commit past the built one.
          args=(--title "atlas v${VERSION}" --generate-notes --latest=false --target "$TARGET_SHA")
          if [[ -n "$PREV_TAG" ]]; then
            args+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "tui-v${VERSION}" dist/* \
            ../serve/dist/atlas-serve-linux-x64 ../serve/dist/atlas-serve-linux-x64.sha256 \
            ../serve/dist/atlas-serve-linux-arm64 ../serve/dist/atlas-serve-linux-arm64.sha256 \
            "${args[@]}"

      - name: dispatch sandbox image retag
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run sandbox-image.yml -f release_tag="tui-v${VERSION}" -f release_sha="$TARGET_SHA"

  # Signed and notarized build, only for a release the `release` job actually cut. The app is
  # stamped with that release's version and its files are attached to the same GitHub release.
  # The release is created with --latest=false and only marked latest here, after the upload, so
  # releases/latest/download/<file> (the Mac auto-updater's URL) never points at a release that
  # lacks the Mac files. The TUI updater reads the releases list, so it is unaffected.
  mac-release:
    runs-on: macos-latest
    needs: [release]
    if: needs.release.outputs.tag != ''
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
      ELECTROBUN_DEVELOPER_ID: 'Developer ID Application: Dennis Lysenko (9H7HK25CVR)'
      ELECTROBUN_APPLEAPIKEY: ${{ secrets.APPLE_API_KEY_ID }}
      ELECTROBUN_APPLEAPIISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - name: restore hutch
        uses: actions/cache@v6
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ hashFiles('apps/mac/hutch.config.ts', 'bun.lock') }}

      - name: import signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/atlas-signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

      - name: write notarization key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ELECTROBUN_APPLEAPIKEYPATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: install create-dmg
        run: command -v create-dmg >/dev/null || brew install create-dmg

      - name: build signed app
        run: |
          set -euo pipefail
          ATLAS_VERSION="${TAG#tui-v}"
          [ -n "$ATLAS_VERSION" ] && [ "$ATLAS_VERSION" != "$TAG" ] || { echo "::error::unexpected release tag '$TAG'"; exit 1; }
          export ATLAS_VERSION
          bun run build:app
        working-directory: apps/mac

      - name: upload to release
        run: |
          set -euo pipefail
          ls -la artifacts
          files=(artifacts/*)
          [ -e "${files[0]}" ] || { echo "::error::apps/mac/artifacts is empty"; exit 1; }
          for attempt in 1 2 3; do
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY" && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::upload attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
        working-directory: apps/mac

      - name: remove signing material
        if: always()
        run: |
          [ -z "$KEYCHAIN_PATH" ] || security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
