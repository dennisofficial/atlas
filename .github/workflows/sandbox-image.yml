name: sandbox-image

on:
  push:
    branches: [main]
  # The retag job runs by dispatch, not on the release event: release.yml creates the
  # release with GITHUB_TOKEN, and GitHub never starts workflow runs from events that
  # token caused. https://docs.github.com/actions/using-workflows/triggering-a-workflow
  workflow_dispatch:
    inputs:
      release_tag:
        description: tui release tag to retag the sandbox image for (tui-vX.Y.Z)
        required: true
      release_sha:
        description: full commit sha the release was cut from
        required: true

permissions:
  contents: read
  packages: write

# No concurrency group, deliberately: a group keeps one running + one pending run and cancels
# older pending runs, so merges landing close together silently skipped publishing their
# sha-<commit> tags — and every merge can be a release whose retag polls for exactly that tag.
# Runs must stack up and each publish its own sha tag; latest is last-writer-wins and self-heals.

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-sandbox
  VCR_IMAGE: vcr.vercel.com/comp-ai/atlas/atlas-sandbox

jobs:
  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tag
        id: meta
        run: echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Docker sandboxes never run serve, so the GHCR image bakes 0-byte placeholders rather
      # than the real ~109MB binary per arch. An empty stamp never matches the launcher's
      # freshness check, so a cloud boot from this image falls back to the download path.
      - name: generate serve placeholders
        run: |
          touch packages/harness/sandbox-image/atlas-serve \
            packages/harness/sandbox-image/atlas-serve.stamp

      - uses: docker/build-push-action@v6
        with:
          context: packages/harness/sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          # Registry-backed cache, not type=gha: legacy CI proved the 10 GB gha
          # cache evicts its own Docker blobs, forcing cold builds.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  publish-vcr:
    # Inert until a VERCEL_VCR_ENABLED=true repo variable exists. Auth is the VERCEL_TOKEN repo
    # secret (a token scoped to the atlas project); the VCR docker username is the team id.
    # VCR only prepares linux/amd64 for Sandbox, so the arm64 variant stays GHCR-only.
    if: github.event_name != 'release' && vars.VERCEL_VCR_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: vcr.vercel.com
          username: team_GR4aCzLIY5D3YYWgITz3Tere
          password: ${{ secrets.VERCEL_TOKEN }}

      - name: compute tag
        id: meta
        run: echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      # Unlike the GHCR placeholders above: cloud sandboxes boot serve straight from the
      # image, so the VCR variant bakes the real binary and a `source:<sha>` stamp the
      # launcher's freshness check can match against the released TUI's build sha.
      - name: build serve into the image context
        working-directory: packages/harness
        run: bun run build:serve -- --target bun-linux-x64 --outfile sandbox-image/atlas-serve

      # Stamp with the same source-hash the api image uses (apps/api/Dockerfile) so the launcher
      # reuses a matching bake instead of re-downloading. A git-sha stamp can never equal the
      # api's source hash, which is why every boot used to download.
      - name: stamp the baked serve
        run: sh packages/harness/scripts/serve-source-stamp.sh > packages/harness/sandbox-image/atlas-serve.stamp

      - uses: docker/build-push-action@v6
        with:
          context: packages/harness/sandbox-image
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.VCR_IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.VCR_IMAGE }}:latest
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

  retag:
    # release-on-main (.github/workflows/release.yml) tags tui releases as tui-vX.Y.Z
    # (apps/tui/scripts/release-version.ts) and dispatches here after each one.
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'tui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tags
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          echo "VERSION=${RELEASE_TAG#tui-v}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-$(echo "$RELEASE_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: retag existing image
        run: |
          set -euo pipefail

          # The release fires right after the push that triggered it, while this same
          # commit's publish job may still be building its own sha tag; a stale latest
          # fallback would retag the PREVIOUS commit's image under the new version, and
          # released binaries pin their sandbox image to that version, so wrong here is
          # load-bearing. Poll for the real tag instead of ever falling back to latest.
          attempts=40
          for ((i = 1; i <= attempts; i++)); do
            if docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
              docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}:${SHA_TAG}"
              echo "Tagged \`${IMAGE}:${VERSION}\` from \`${IMAGE}:${SHA_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting for ${IMAGE}:${SHA_TAG} to publish (attempt ${i}/${attempts})"
            sleep 30
          done

          echo "::error::${IMAGE}:${SHA_TAG} never appeared after 20 minutes -- the publish job for this commit likely failed" >&2
          exit 1

      - uses: docker/login-action@v3
        if: vars.VERCEL_VCR_ENABLED == 'true'
        with:
          registry: vcr.vercel.com
          username: team_GR4aCzLIY5D3YYWgITz3Tere
          password: ${{ secrets.VERCEL_TOKEN }}

      # Same poll as the GHCR retag above: the released TUI pins its cloud sandbox image to
      # `atlas-sandbox:<version>`, so the tag must come from this commit's real sha tag.
      - name: retag existing VCR image
        if: vars.VERCEL_VCR_ENABLED == 'true'
        run: |
          set -euo pipefail

          attempts=40
          for ((i = 1; i <= attempts; i++)); do
            if docker buildx imagetools inspect "${VCR_IMAGE}:${SHA_TAG}" >/dev/null 2>&1; then
              docker buildx imagetools create -t "${VCR_IMAGE}:${VERSION}" "${VCR_IMAGE}:${SHA_TAG}"
              echo "Tagged \`${VCR_IMAGE}:${VERSION}\` from \`${VCR_IMAGE}:${SHA_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "waiting for ${VCR_IMAGE}:${SHA_TAG} to publish (attempt ${i}/${attempts})"
            sleep 30
          done

          echo "::error::${VCR_IMAGE}:${SHA_TAG} never appeared after 20 minutes -- the publish-vcr job for this commit likely failed" >&2
          exit 1
