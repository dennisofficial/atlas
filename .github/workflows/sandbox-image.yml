name: sandbox-image

on:
  push:
    branches: [main]
    # Only the image's own bytes matter: a merge that touches neither the context nor this
    # workflow would republish the identical image under a new sha tag.
    paths:
      - 'infra/sandbox-image/**'
      - '!infra/sandbox-image/README.md'
      - '.github/workflows/sandbox-image.yml'
  # A manual republish when the path trigger above cannot fire.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# No concurrency group, deliberately: a group keeps one running + one pending run and cancels
# older pending runs, so merges landing close together silently skipped publishing their
# sha-<commit> tags. Runs must stack up and each publish its own sha tag; latest is
# last-writer-wins and self-heals.
#
# The Agent37 template and the VCR `latest` image follow the image's digest, pinned by the run
# that published it. Serve is not baked in and no longer downloaded per release, so nothing about
# this image is version-specific and no release re-pins it (decision D5,
# docs/slices/v1-retirement.md).

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-sandbox
  VCR_IMAGE: vcr.vercel.com/comp-ai/atlas-sandboxes/atlas-sandbox

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tree-<hash> names the image by the files of its build context, README aside, so a run whose
      # context matches an image ghcr already holds reuses that image instead of rebuilding: a rebuild
      # that misses the layer cache is not byte-identical (apt pulls the day's packages, BuildKit
      # stamps the build time), and every new digest re-pins the Agent37 template and marks each
      # instance outdated. The hash covers the paths under the directory's own name; the tags it
      # produced while the directory still lived at apps/serve/sandbox-image do not repeat, so the
      # first run after that move published one new tree tag.
      - name: compute tags
        id: meta
        run: |
          set -euo pipefail
          tree_tag="tree-$(git ls-tree HEAD infra/sandbox-image/ \
            | grep -v '/README.md$' \
            | git hash-object --stdin | cut -c1-12)"
          echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "tree_tag=${tree_tag}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${IMAGE}:${tree_tag}" >/dev/null 2>&1; then
            echo "prebuilt=true" >> "$GITHUB_OUTPUT"
          fi

      - name: tag the commit with the image its context already built
        if: steps.meta.outputs.prebuilt == 'true'
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          TREE_TAG: ${{ steps.meta.outputs.tree_tag }}
        run: docker buildx imagetools create -t "${IMAGE}:${SHA_TAG}" "${IMAGE}:${TREE_TAG}"

      - uses: docker/build-push-action@v7
        if: steps.meta.outputs.prebuilt != 'true'
        env:
          # Build records are ~7,000 tiny artifacts that count against Actions storage.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: infra/sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tree_tag }}
            ${{ env.IMAGE }}:latest
          # Registry-backed cache, not type=gha: legacy CI proved the 10 GB gha
          # cache evicts its own Docker blobs, forcing cold builds.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install --frozen-lockfile

      # The Agent37 template is pinned by digest, never by a tag a later merge can move, so
      # resolve the digest ghcr holds for this run's image here and hand it to the register step.
      # linux/amd64 first, the same choice agent37-register-template.ts's registryDigestOf makes
      # for itself: that is the leg both Agent37 pods and the VCR push below run.
      - name: resolve the image digest
        id: image
        env:
          TREE_TAG: ${{ steps.meta.outputs.tree_tag }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TREE_TAG}" --format '{{json .Manifest}}' | bun -e '
            const manifest = JSON.parse(await Bun.stdin.text())
            const amd64 = (manifest.manifests ?? []).find(
              (entry) => entry.platform?.os === "linux" && entry.platform?.architecture === "amd64",
            )
            process.stdout.write(amd64?.digest ?? manifest.digest ?? "")
          ')"
          if [ -z "$digest" ]; then
            digest="$(docker buildx imagetools inspect "${IMAGE}:${TREE_TAG}" --format '{{.Digest}}')"
          fi
          if [ -z "$digest" ]; then
            echo "ghcr has no image for ${IMAGE}:${TREE_TAG}" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # An image-identical run publishes no new digest, so it must not re-pin the template and mark
      # every live instance outdated.
      - name: check whether the agent37 template already pins this image
        id: template
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ENC }}
        run: |
          set -euo pipefail
          state="$(bunx dotenvx run -f apps/api/.env.production.enc -- \
            bun apps/api/scripts/agent37-register-template.ts --check \
              --tag '${{ steps.image.outputs.digest }}' | tail -n 1)"
          case "$state" in current | stale) ;; *) echo "unexpected check answer: $state" >&2; exit 1 ;; esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "agent37 template is $state for ${{ steps.image.outputs.digest }}"

      - uses: docker/login-action@v4
        if: vars.VERCEL_VCR_ENABLED == 'true' && steps.template.outputs.state == 'stale'
        with:
          registry: vcr.vercel.com
          username: team_GR4aCzLIY5D3YYWgITz3Tere
          password: ${{ secrets.VERCEL_TOKEN }}

      - name: publish the latest VCR image
        if: vars.VERCEL_VCR_ENABLED == 'true' && steps.template.outputs.state == 'stale'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: infra/sandbox-image
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.VCR_IMAGE }}:latest
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      # After the push, never before: the fresh image now holds `latest`, and every image a
      # sandbox (running or stopped) still references is spared so resumes keep working.
      - name: prune VCR images to latest plus in-use
        if: vars.VERCEL_VCR_ENABLED == 'true' && steps.template.outputs.state == 'stale'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_GR4aCzLIY5D3YYWgITz3Tere
          VERCEL_PROJECT_ID: prj_kmYGr5ZuEyOeZdJpjw2pZaVOaJwo
          VERCEL_PROJECT_NAME: atlas-sandboxes
        run: bun scripts/sandbox-image/prune-vcr-images.ts

      # The Agent37 template must point at the same image release as VCR, or the two providers
      # drift apart with nothing to detect it. The digest resolved above is this run's image and a
      # digest cannot be moved by a later merge the way a tag can. Runs whether or not VCR is
      # enabled: the template is what every Agent37 pod boots from.
      - name: register the agent37 template
        if: steps.template.outputs.state == 'stale'
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ENC }}
        run: |
          set -euo pipefail
          bunx dotenvx run -f apps/api/.env.production.enc -- \
            bun apps/api/scripts/agent37-register-template.ts \
              --tag '${{ steps.image.outputs.digest }}'
