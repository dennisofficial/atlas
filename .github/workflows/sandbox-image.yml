name: sandbox-image

on:
  push:
    branches: [main]
    # Only the image's own bytes matter: a merge that touches neither the context nor this
    # workflow would republish the identical image under a new sha tag.
    paths: ['apps/serve/sandbox-image/**', '.github/workflows/sandbox-image.yml']
  # The retag job runs by dispatch, not on the release event: the release job in ci.yml
  # creates the release with GITHUB_TOKEN, and GitHub never starts workflow runs from events
  # that token caused. https://docs.github.com/actions/using-workflows/triggering-a-workflow
  workflow_dispatch:
    inputs:
      release_tag:
        description: tui release tag to retag the sandbox image for (tui-vX.Y.Z)
        required: true
      release_sha:
        description: full commit sha the release was cut from
        required: true

permissions:
  contents: read
  packages: write

# No concurrency group, deliberately: a group keeps one running + one pending run and cancels
# older pending runs, so merges landing close together silently skipped publishing their
# sha-<commit> tags. Runs must stack up and each publish its own sha tag; latest is
# last-writer-wins and self-heals.
#
# VCR gets no per-merge push: the retag job below pushes `latest` only, once per release.
# Serve is not baked in, so nothing about the image is version-specific.

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-sandbox
  VCR_IMAGE: vcr.vercel.com/comp-ai/atlas-sandboxes/atlas-sandbox

jobs:
  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tag
        id: meta
        run: echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        env:
          # Build records are ~7,000 tiny artifacts that count against Actions storage.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: apps/serve/sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          # Registry-backed cache, not type=gha: legacy CI proved the 10 GB gha
          # cache evicts its own Docker blobs, forcing cold builds.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  retag:
    # release-on-main (the release job in .github/workflows/ci.yml) tags tui releases as tui-vX.Y.Z
    # (apps/tui/scripts/release-version.ts) and dispatches here after each one.
    #
    # needs: publish because a dispatch runs that job too — its `if` is `event_name != 'release'`
    # and this workflow has no release trigger, so it always runs — and the template below pins
    # the image ghcr holds for the release commit. Waiting on it orders the two writes and stops
    # the retag from publishing to VCR and Agent37 when the image itself never landed.
    needs: publish
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'tui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: vars.VERCEL_VCR_ENABLED == 'true'
        with:
          registry: vcr.vercel.com
          username: team_GR4aCzLIY5D3YYWgITz3Tere
          password: ${{ secrets.VERCEL_TOKEN }}

      - name: publish the latest VCR image
        if: vars.VERCEL_VCR_ENABLED == 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: apps/serve/sandbox-image
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.VCR_IMAGE }}:latest
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - uses: oven-sh/setup-bun@v2.2.0

      # The Agent37 template is pinned by digest, never by a tag a later merge can move, so
      # resolve the digest ghcr holds for the release commit here and hand it to the register
      # step. linux/amd64 first, the same choice agent37-register-template.ts's registryDigestOf
      # makes for itself: that is the leg both Agent37 pods and the VCR push above run.
      - name: resolve the release image digest
        id: release-image
        env:
          IMAGE: ${{ env.IMAGE }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          tag="sha-$(echo "$RELEASE_SHA" | cut -c1-7)"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' | bun -e '
            const manifest = JSON.parse(await Bun.stdin.text())
            const amd64 = (manifest.manifests ?? []).find(
              (entry) => entry.platform?.os === "linux" && entry.platform?.architecture === "amd64",
            )
            process.stdout.write(amd64?.digest ?? manifest.digest ?? "")
          ')"
          if [ -z "$digest" ]; then
            digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Digest}}')"
          fi
          if [ -z "$digest" ]; then
            echo "ghcr has no image for ${IMAGE}:${tag}" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # After the push, never before: the fresh image now holds `latest`, and every image a
      # sandbox (running or stopped) still references is spared so resumes keep working.
      - name: prune VCR images to latest plus in-use
        if: vars.VERCEL_VCR_ENABLED == 'true'
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_GR4aCzLIY5D3YYWgITz3Tere
          VERCEL_PROJECT_ID: prj_kmYGr5ZuEyOeZdJpjw2pZaVOaJwo
          VERCEL_PROJECT_NAME: atlas-sandboxes
        run: bun apps/serve/scripts/prune-vcr-images.ts

      # The Agent37 template must point at the same image release as VCR, or the two providers
      # drift apart with nothing to detect it. The digest resolved above is the release commit's
      # image, the build the VCR push re-ships, and a digest cannot be moved by a later merge the
      # way a tag can. Runs whether or not VCR is enabled: the template is what every Agent37 pod
      # boots from.
      - name: register the agent37 template
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION_ENC: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION_ENC }}
        run: |
          set -euo pipefail
          # This job installs no workspace deps, so `bunx dotenvx` would fetch the unrelated npm
          # package of that name: name the real one at the version the root package.json asks for.
          bunx --package @dotenvx/dotenvx@^1.71.0 dotenvx run -f apps/api/.env.production.enc -- \
            bun apps/api/scripts/agent37-register-template.ts \
              --tag '${{ steps.release-image.outputs.digest }}'
