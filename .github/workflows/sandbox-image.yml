name: sandbox-image

on:
  push:
    branches: [main]
  # The retag job runs by dispatch, not on the release event: the release job in ci.yml
  # creates the release with GITHUB_TOKEN, and GitHub never starts workflow runs from events
  # that token caused. https://docs.github.com/actions/using-workflows/triggering-a-workflow
  workflow_dispatch:
    inputs:
      release_tag:
        description: tui release tag to retag the sandbox image for (tui-vX.Y.Z)
        required: true
      release_sha:
        description: full commit sha the release was cut from
        required: true

permissions:
  contents: read
  packages: write

# No concurrency group, deliberately: a group keeps one running + one pending run and cancels
# older pending runs, so merges landing close together silently skipped publishing their
# sha-<commit> tags. Runs must stack up and each publish its own sha tag; latest is
# last-writer-wins and self-heals.
#
# VCR gets no per-merge push: the retag job below pushes `latest` only, once per release.
# Serve is not baked in, so nothing about the image is version-specific.

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atlas-sandbox
  VCR_IMAGE: vcr.vercel.com/comp-ai/atlas/atlas-sandbox

jobs:
  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: compute tag
        id: meta
        run: echo "sha_tag=sha-$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: apps/serve/sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          # Registry-backed cache, not type=gha: legacy CI proved the 10 GB gha
          # cache evicts its own Docker blobs, forcing cold builds.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  retag:
    # release-on-main (the release job in .github/workflows/ci.yml) tags tui releases as tui-vX.Y.Z
    # (apps/tui/scripts/release-version.ts) and dispatches here after each one.
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'tui-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: vars.VERCEL_VCR_ENABLED == 'true'
        with:
          registry: vcr.vercel.com
          username: team_GR4aCzLIY5D3YYWgITz3Tere
          password: ${{ secrets.VERCEL_TOKEN }}

      - name: publish the latest VCR image
        if: vars.VERCEL_VCR_ENABLED == 'true'
        uses: docker/build-push-action@v7
        with:
          context: apps/serve/sandbox-image
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.VCR_IMAGE }}:latest
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
