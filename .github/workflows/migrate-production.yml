name: migrate-production

on:
  push:
    branches: [main]
    paths:
      - apps/api/prisma/migrations/**
      - apps/api/prisma/schema.prisma
      - .github/workflows/migrate-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile --filter '@dltech/atlas-api'

      - run: bun run db:migrate:deploy
        working-directory: apps/api
        env:
          MIGRATE_TIER: production
          DOTENV_PRIVATE_KEY_API_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_API_PRODUCTION }}
