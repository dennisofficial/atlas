name: flake-next-cache-key-proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-key-from-step-output:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: compute the next cache key
        id: next-cache
        run: |
          set -euo pipefail
          lock=$(git ls-files -s -- bun.lock | shasum -a 256 | cut -d' ' -f1)
          web=$(git ls-files -s -- apps/web/src 'apps/web/*.ts' 'apps/web/*.mjs' apps/web/package.json | shasum -a 256 | cut -d' ' -f1)
          echo "key=proof-${{ runner.os }}-${{ github.run_id }}-$lock-$web" >> "$GITHUB_OUTPUT"
          echo "previous=proof-${{ runner.os }}-$lock-" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .proof-next-cache
          key: ${{ steps.next-cache.outputs.key }}
          restore-keys: |
            ${{ steps.next-cache.outputs.previous }}
            proof-${{ runner.os }}-

      - name: fill the cached directory after the cache step, as the build does
        run: |
          mkdir -p .proof-next-cache
          echo "$GITHUB_RUN_ID" > .proof-next-cache/entry
