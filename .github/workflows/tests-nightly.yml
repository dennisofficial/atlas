# Nightly guard for the incremental test cache (see the `test` job in ci.yml). It first plans what
# main's cache would skip (BUN_TEST_INCREMENTAL=plan), then runs every spec (BUN_TEST_INCREMENTAL=force,
# which also refreshes main's cache) and fails only when a spec the cache would have skipped fails in the
# full run — the cache hiding a failure. Never pass `--changed` here: the nightly is the whole-suite
# backstop, so no git-diff pre-filter may narrow it. Ordinary failures already fail the push and PR runs.
name: tests-nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tests-nightly
  cancel-in-progress: false

env:
  ATLAS_HOME: ${{ github.workspace }}/.atlas-home
  NODE_ENV: development

jobs:
  verify-cache:
    runs-on: ubuntu-latest
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:55441/atlas_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: bun install

      - name: restore incremental test cache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/incremental-tests
          key: incremental-tests-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            incremental-tests-${{ github.ref }}-

      - name: plan what the cache would skip
        env:
          BUN_TEST_INCREMENTAL: plan
          BUN_TEST_INCREMENTAL_SUMMARY_DIR: ${{ runner.temp }}/plan
        run: bun run --filter './packages/*' --filter './apps/*' --filter './evals' test

      - name: run everything
        continue-on-error: true
        env:
          BUN_TEST_INCREMENTAL: force
          BUN_TEST_INCREMENTAL_SUMMARY_DIR: ${{ runner.temp }}/full
        run: bun run --filter './packages/*' --filter './apps/*' --filter './evals' test

      - name: check the cache hid no failure
        if: always()
        run: |
          flat() { jq -s '[.[] | if type == "array" then .[] else . end]' "$@"; }
          for d in plan full; do
            ls "$RUNNER_TEMP/$d"/*.json >/dev/null 2>&1 || { echo "::error::nightly check incomplete: no $d summaries"; exit 1; }
          done
          plan=$(flat "$RUNNER_TEMP"/plan/*.json)
          missed=$(flat "$RUNNER_TEMP"/full/*.json | jq -r --argjson plan "$plan" \
            '[.[].failedFiles[] | sub(" \\(.*\\)$"; "")] - [$plan[].executedFiles[]] | .[]')
          if [ -n "$missed" ]; then
            {
              echo "### Cache hid failing tests"
              echo "These failed in the full run, but an incremental run would have reused a cached pass:"
              echo "$missed" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$missed" | while read -r file; do echo "::error file=$file::failed in the full run but the cache would have skipped it"; done
            exit 1
          fi
          echo "### Cache verified: every failing file would also have run incrementally" >> "$GITHUB_STEP_SUMMARY"

      - name: report
        if: always()
        run: .github/scripts/incremental-report.sh .cache/incremental-tests "$RUNNER_TEMP"/full/*.json

      - name: save incremental test cache
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/incremental-tests
          key: incremental-tests-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
