services:
  postgres:
    command: docker compose up postgres
    cwd: apps/api
    port: 5433
  api:
    command: bun run dev:no-trigger
    cwd: apps/api
    port: 3400
    health: /v1/health
    env:
      ATLAS_POSTGRES_PORT: ${services.postgres.port}
      WEB_ORIGIN: ${services.web.publicUrl}
      TRUSTED_ORIGINS: ${services.web.publicUrl}
    setup:
      - bun install
      - bun run db:migrate
  web:
    command: bun run dev -H 0.0.0.0
    cwd: apps/web
    health: /
    setup:
      - bun install
    portal:
      title: Atlas web
  storybook:
    command: bun run dev --host 0.0.0.0
    cwd: apps/storybook
    health: /
    setup:
      - bun install
    portal:
      title: Storybook
  prototype:
    command: bun run dev -H 0.0.0.0
    cwd: apps/prototype
    health: /
    setup:
      - bun install
    portal:
      title: Prototype
