services:
  test-postgres:
    image: postgres:17-alpine
    container_name: atlas-test-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_test
    ports:
      - '55441:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas_test']
      interval: 2s
      timeout: 3s
      retries: 15
