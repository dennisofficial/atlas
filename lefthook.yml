pre-commit:
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,html,md,yaml,yml}'
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    dotenvx:
      glob: '*.env*'
      run: node_modules/.bin/dotenvx ext precommit
    env-tiers:
      run: bun apps/api/scripts/check-env-tiers.ts
    trpc-router:
      glob: '{apps/api/src/**/*.ts,packages/wire/src/**/*.ts}'
      run: bun run --cwd apps/api generate:trpc && git add packages/api-router/src/generated
    plugin-types:
      glob: '{packages/core/src/**/*.ts,packages/wire/src/**/*.ts,packages/harness/src/**/*.ts}'
      exclude: '**/plugin-types.generated.ts'
      run: bun run --cwd packages/harness plugin-types:generate && git add packages/harness/src/plugin-types/plugin-types.generated.ts
