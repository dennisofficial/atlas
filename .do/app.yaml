name: atlas-api
region: nyc
services:
  - name: api
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: dennisofficial/atlas
      branch: main
      deploy_on_push: true
    http_port: 3400
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /v1/health
      initial_delay_seconds: 20
    envs:
      - key: APP_TIER
        value: production
      - key: DOTENV_PRIVATE_KEY_API_PRODUCTION
        type: SECRET
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: /
    dockerfile_path: apps/api/Dockerfile
    github:
      repo: dennisofficial/atlas
      branch: main
    instance_size_slug: basic-xxs
    run_command: npm run db:migrate:deploy
    envs:
      - key: APP_TIER
        value: production
      - key: MIGRATE_TIER
        value: production
      - key: DOTENV_PRIVATE_KEY_API_PRODUCTION
        type: SECRET
